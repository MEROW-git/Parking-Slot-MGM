{% comment %}
Usage:
{% include "components/alert.html" with type="success" message="Reservation Confirmed" %}
{% endcomment %}
<div class="sp-alert sp-alert-{{ type|default:'info' }}" role="alert" id="alert-{{ id|default:'msg' }}">
  <strong>{% if type == 'success' %}Confirmed{% elif type == 'warning' %}Attention{% elif type == 'error' or type == 'danger' %}Error{% else %}Notice{% endif %}</strong>
  <div>{{ message }}</div>
</div>
