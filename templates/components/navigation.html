<nav class="sp-navbar" aria-label="Main Navigation">
  <div class="sp-container sp-nav-inner">
    <a href="{% url 'home' %}" class="sp-brand" id="brand-logo" aria-label="SomPark Phnom Penh">
      <span class="sp-brand-badge">ភ្នំពេញ</span>
      <span>SomPark</span>
    </a>

    <ul class="sp-nav-links" id="main-nav-menu">
      <li><a href="{% url 'home' %}" class="sp-nav-link" id="nav-home">Availability (ចំណត)</a></li>
      {% if user.is_authenticated %}
        <li><a href="{% url 'book' %}" class="sp-nav-link" id="nav-book">Book Slot (កក់កន្លែង)</a></li>
        <li><a href="{% url 'all_tickets' %}" class="sp-nav-link" id="nav-tickets">My Tickets (សំបុត្រខ្ញុំ)</a></li>
      {% endif %}
      <li><a href="{% url 'component_showcase' %}" class="sp-nav-link" id="nav-components">Design System</a></li>
    </ul>

    <div class="sp-nav-auth">
      {% if user.is_authenticated %}
        <span style="font-weight:700; font-size:0.9rem; color:var(--sp-text-muted);" id="user-greeting">
          👤 {{ user.username }}
        </span>
        <form action="{% url 'logout' %}" method="post" style="display:inline;" id="logout-form">
          {% csrf_token %}
          <button type="submit" class="sp-btn sp-btn-secondary sp-btn-sm" id="btn-logout" title="Sign out of SomPark">
            Sign Out
          </button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="sp-btn sp-btn-secondary sp-btn-sm" id="btn-nav-login">Sign In</a>
        <a href="{% url 'signup' %}" class="sp-btn sp-btn-primary sp-btn-sm" id="btn-nav-signup">Register (ចុះឈ្មោះ)</a>
      {% endif %}
      <button class="sp-btn sp-btn-secondary sp-btn-sm mobile-only" id="btn-mobile-toggle" aria-label="Toggle menu" style="display:none;">
        ☰
      </button>
    </div>
  </div>
</nav>
