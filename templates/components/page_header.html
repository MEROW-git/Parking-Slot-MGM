{% comment %}
Usage:
{% include "components/page_header.html" with title="Book Parking Spot" subtitle="Reserve your slot in central Phnom Penh" khmer_tag="កក់កន្លែងចំណត" %}
{% endcomment %}
<header class="sp-page-header" id="page-header">
  {% if khmer_tag %}
    <div class="sp-page-khmer">
      {{ khmer_tag }}
    </div>
  {% endif %}
  <h1>{{ title }}</h1>
  {% if subtitle %}
    <p>{{ subtitle }}</p>
  {% endif %}
</header>
