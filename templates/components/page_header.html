{% comment %}
Usage:
{% include "components/page_header.html" with title="Book Parking Spot" subtitle="Reserve your slot in central Phnom Penh" khmer_tag="កក់កន្លែងចំណត" %}
{% endcomment %}
<header style="margin-bottom:2rem; padding-bottom:1.25rem; border-bottom:2px solid var(--sp-border-strong);" id="page-header">
  {% if khmer_tag %}
    <div style="font-weight:700; font-size:0.9rem; color:var(--sp-red); margin-bottom:0.25rem;">
      {{ khmer_tag }}
    </div>
  {% endif %}
  <h1 style="margin-bottom:0.35rem;">{{ title }}</h1>
  {% if subtitle %}
    <p style="color:var(--sp-text-muted); font-size:1.05rem; margin-bottom:0;">{{ subtitle }}</p>
  {% endif %}
</header>
