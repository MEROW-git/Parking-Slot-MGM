{% comment %}
Usage:
{% include "components/form_field.html" with field=form.plate_number %}
{% endcomment %}
<div class="sp-form-group" id="group_{{ field.id_for_label }}">
  <label for="{{ field.id_for_label }}" class="sp-label">
    {{ field.label }}
    {% if field.field.required %}<span class="sp-required" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  <div class="sp-field-feedback">
    {% if field.errors %}
      {% for error in field.errors %}<p class="sp-field-error" role="alert">{{ error }}</p>{% endfor %}
    {% elif field.help_text %}
      <p class="sp-field-help">{{ field.help_text }}</p>
    {% else %}
      <span aria-hidden="true">&nbsp;</span>
    {% endif %}
  </div>
</div>
