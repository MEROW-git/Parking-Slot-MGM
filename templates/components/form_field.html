{% comment %}
Usage:
{% include "components/form_field.html" with field=form.plate_number %}
{% endcomment %}
<div class="sp-form-group" id="group_{{ field.id_for_label }}">
  <label for="{{ field.id_for_label }}" class="sp-label">
    {{ field.label }}
    {% if field.field.required %}<span style="color:var(--sp-red);" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <p class="sp-field-help">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    {% for error in field.errors %}
      <p class="sp-field-error" role="alert">⚠ {{ error }}</p>
    {% endfor %}
  {% endif %}
</div>
