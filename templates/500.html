{% extends "base.html" %}

{% block title %}Service Unavailable | SomPark{% endblock %}

{% block content %}
<article class="sp-error-page" data-reveal="up">
  <p class="sp-error-code">500</p>
  <h1>SomPark could not complete that request.</h1>
  <p>Please try again. If the problem continues, return to live parking availability and start a new request.</p>
  <a href="{% url 'home' %}" class="sp-btn sp-btn-primary">Return to availability</a>
</article>
{% endblock %}
